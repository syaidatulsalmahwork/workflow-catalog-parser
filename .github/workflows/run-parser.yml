# Catalog parser on the lab PC runner.
# Runs C#\github-run.ps1 (writes ExtraExtract from the issue, then dotnet run).

name: Run catalog parser

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Mailbox issue number
        required: false
  repository_dispatch:
    types: [run-parser]

jobs:
  parse:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      PARSER_DIR: C:\Users\syaidatul.salmah\source\repos\AI-Parser-Development\C#
    steps:
      - name: Run parser
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%PARSER_DIR%\github-run.ps1"
